name: CI

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

env:
  RUST_BACKTRACE: 1

jobs:
  # ─────────────────────────────────────────────
  # 1. Rust unit tests (native, no WASM target needed)
  # ─────────────────────────────────────────────
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ui/src/wasm/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ui/src/wasm/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --check
        working-directory: ui/src/wasm

      - name: cargo clippy
        run: cargo clippy -- -D warnings
        working-directory: ui/src/wasm

      - name: cargo test
        run: cargo test
        working-directory: ui/src/wasm

  # ─────────────────────────────────────────────
  # 2. Python lint + WCAG validation
  # ─────────────────────────────────────────────
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: ruff check
        run: ruff check --config resources/config/ruff.toml scripts/ run.py

      - name: ruff format --check
        run: ruff format --check --config resources/config/ruff.toml scripts/ run.py

  # ─────────────────────────────────────────────
  # 3. Component tests (pytest source-analysis)
  # ─────────────────────────────────────────────────
  component-test:
    name: Component Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run component tests
        run: python run.py test
