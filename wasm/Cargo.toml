[package]
name = "ggp3d-wasm"
version = "0.1.0"
edition = "2021"
description = "3D geometry processing core for ggp3d, compiled to WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"
lto = true
